<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">

<title>NEXORA // COMMAND</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:#05070d;
  color:#eafcff;
  font-family:Orbitron,Arial,sans-serif;
  overflow-x:hidden;
}

/* GRID BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);
  background-size:35px 35px;
  z-index:-2;
}

/* GLOW */
body::after{
  content:"";
  position:fixed;
  width:450px;
  height:450px;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
  background:rgba(0,234,255,.06);
  filter:blur(100px);
  pointer-events:none;
  z-index:-1;
}

/* SCAN LINE */
.scan{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:2px;
  background:#00eaff;
  box-shadow:0 0 20px #00eaff;
  animation:scan 6s linear infinite;
  z-index:999;
}

@keyframes scan{
  0%{transform:translateY(0)}
  100%{transform:translateY(100vh)}
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:100;
  padding:18px 6%;
  border-bottom:1px solid #153640;
  background:rgba(5,7,13,.88);
  backdrop-filter:blur(15px);
}

.logo{
  color:#00eaff;
  font-size:21px;
  font-weight:800;
  letter-spacing:3px;
  text-shadow:0 0 18px rgba(0,234,255,.7);
}

.logo span{
  color:#fff;
}

/* CONTAINER */
.container{
  width:min(1000px,92%);
  margin:auto;
  padding:35px 0;
}

/* PAGE */
.page{
  display:none;
  animation:pageIn .4s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* HERO */
.hero{
  text-align:center;
  margin:20px 0 35px;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border:1px solid #00eaff;
  border-radius:30px;
  color:#00eaff;
  font-size:9px;
  letter-spacing:2px;
  margin-bottom:16px;
  box-shadow:0 0 15px rgba(0,234,255,.12);
}

.hero h1{
  font-size:clamp(35px,9vw,72px);
  letter-spacing:5px;
  color:#fff;
  text-shadow:
    0 0 10px #00eaff,
    0 0 35px rgba(0,234,255,.45);
}

.hero p{
  margin-top:12px;
  color:#6f8993;
  font-size:10px;
  letter-spacing:2px;
}

/* CARD */
.card{
  background:rgba(10,16,24,.82);
  border:1px solid #173f4a;
  border-radius:20px;
  padding:25px;
  box-shadow:
    0 0 35px rgba(0,234,255,.07),
    inset 0 0 30px rgba(0,234,255,.015);
  backdrop-filter:blur(15px);
}

h2{
  color:#00eaff;
  font-size:19px;
  margin-bottom:20px;
  letter-spacing:1px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:#78939c;
  font-size:9px;
  letter-spacing:1px;
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  background:#060c13;
  border:1px solid #214854;
  color:#fff;
  border-radius:11px;
  outline:none;
  font-family:inherit;
  transition:.25s;
}

input:focus{
  border-color:#00eaff;
  box-shadow:0 0 15px rgba(0,234,255,.15);
}

/* CHECK */
.check{
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin:20px 0;
}

.check input{
  width:auto;
  margin-top:2px;
}

.check label{
  font-family:Arial,sans-serif;
  font-size:13px;
  line-height:1.5;
  color:#91a7ae;
}

/* BUTTONS */
button{
  border:none;
  outline:none;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
  letter-spacing:1px;
  border-radius:11px;
  padding:14px 18px;
  transition:.25s;
}

button:active{
  transform:scale(.97);
}

.primary{
  width:100%;
  color:#001014;
  background:#00eaff;
  box-shadow:0 0 20px rgba(0,234,255,.25);
}

.primary:hover{
  box-shadow:0 0 35px rgba(0,234,255,.55);
}

.secondary{
  color:#9eefff;
  background:#0d1820;
  border:1px solid #214854;
}

.secondary:hover{
  border-color:#00eaff;
}

.danger{
  color:#ff7181;
  background:#281016;
  border:1px solid #64232e;
}

.danger:hover{
  box-shadow:0 0 20px rgba(255,60,90,.15);
}

.error{
  min-height:18px
